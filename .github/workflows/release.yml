# Publie une release à chaque poussée sur `main`.
#
# La version est déduite des commits (Conventional Commits) depuis le dernier tag :
#   - `BREAKING CHANGE` ou `type!:`  → majeure
#   - `feat:`                        → mineure
#   - tout le reste                  → correctif (par défaut)
# Sans tag existant, la version déclarée dans `Cargo.toml` est publiée telle quelle.
#
# La version n'est jamais réécrite dans le dépôt : elle est injectée dans
# `Cargo.toml` et `tauri.conf.json` le temps du build, et portée par le tag.
# Un commit dont le message contient `[skip release]` ne publie rien.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deux poussées rapprochées ne doivent pas calculer la même version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Mêmes vérifications que sur une PR : rien n'est publié si elles échouent.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le dépôt et ses tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculer la version
        id: version
        run: |
          if git log -1 --format=%B | grep -qF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          else
            if [ "$(git rev-list --count "$last..HEAD")" = "0" ]; then
              echo "Aucun commit depuis $last."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log --format='%s%n%b' "$last..HEAD")
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi

          if git rev-parse -q --verify "refs/tags/v$next" > /dev/null; then
            echo "::error::Le tag v$next existe déjà."
            exit 1
          fi
          echo "Version publiée : $next (précédente : ${last:-aucune})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Injecter la version
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Installer Rust
        if: steps.version.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        if: steps.version.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer Node
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer les dépendances de l'interface
        if: steps.version.outputs.skip == 'false'
        working-directory: frontend
        run: npm ci

      # Sans la clé, le binaire chiffrerait avec la clé de développement publique :
      # il ne lirait pas les données des autres binaires, et les siennes ne seraient
      # pas protégées. On refuse de publier.
      - name: Vérifier la clé de chiffrement
        if: steps.version.outputs.skip == 'false'
        env:
          BOOKMARK_OVERLAY_DATA_KEY: ${{ secrets.BOOKMARK_OVERLAY_DATA_KEY }}
        run: |
          if [ -z "$BOOKMARK_OVERLAY_DATA_KEY" ]; then
            echo "::error::Secret BOOKMARK_OVERLAY_DATA_KEY absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # `GITHUB_REPOSITORY` est lu à la compilation : c'est le dépôt que le binaire
      # interrogera pour ses mises à jour. Les clés sont injectées de la même façon.
      - name: Construire l'installateur et l'exécutable portable
        if: steps.version.outputs.skip == 'false'
        env:
          BOOKMARK_OVERLAY_DATA_KEY: ${{ secrets.BOOKMARK_OVERLAY_DATA_KEY }}
          BOOKMARK_OVERLAY_LEGACY_KEY: ${{ secrets.BOOKMARK_OVERLAY_LEGACY_KEY }}
        run: npx --yes @tauri-apps/cli@2 build

      - name: Rassembler les livrables
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$setup" "release/BookmarkOverlay-$VERSION-setup.exe"
          cp src-tauri/target/release/bookmark-overlay.exe "release/BookmarkOverlay-$VERSION-portable.exe"
          ls -l release

      - name: Publier la release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
